<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07b53b">
  <title>安裝我de家客服</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #15251b; background: #f4f7f5; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 440px); background: white; border-radius: 28px; padding: 30px 24px; box-shadow: 0 18px 55px rgba(19, 57, 34, .12); }
    .icon { width: 82px; height: 82px; border-radius: 22px; display: grid; place-items: center; color: white; background: linear-gradient(145deg, #07c755, #009f3b); font-size: 42px; margin-bottom: 20px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #5d6d62; line-height: 1.65; }
    .install { display: block; margin: 24px 0 18px; padding: 16px; border-radius: 15px; text-align: center; color: white; background: #07b53b; text-decoration: none; font-weight: 750; }
    ol { padding-left: 22px; line-height: 1.8; color: #394b3f; }
    small { display: block; padding: 13px; border-radius: 12px; background: #f1f7f3; color: #53645a; line-height: 1.55; }
    .open { display: block; text-align: center; color: #087b36; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="icon">💬</div>
    <h1>我de家客服</h1>
    <p>下載 Apple 描述檔，在 iPhone 主畫面加入全螢幕客服管理入口。</p>
    <a class="install" href="./wodejia-line-console.mobileconfig">下載 Apple 描述檔</a>
    <ol>
      <li>請使用 Safari 開啟本頁並允許下載。</li>
      <li>前往「設定」並點選「已下載描述檔」。</li>
      <li>確認內容只有一個 Web Clip，然後點「安裝」。</li>
    </ol>
    <small>此描述檔只加入網站捷徑，不包含 VPN、密碼、憑證或裝置管理權限，且可隨時移除。</small>
    <a class="open" href="./">不安裝，直接開啟網頁</a>
  </main>
</body>
</html>
